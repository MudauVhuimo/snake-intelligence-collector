<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380"><rect width="1000" height="380" fill="#111a2b" rx="15"/><text x="30" y="38" fill="#f8fafc" font-family="sans-serif" font-size="22">How similarly do students perform in the two environments?</text><g fill="#cbd5e1" font-family="sans-serif" font-size="12"><line x1="490" y1="76" x2="490" y2="326" stroke="#64748b"/><text x="490" y="355" text-anchor="middle">Spearman correlation (trial metric vs league metric)</text><text x="18" y="117" fill="#cbd5e1">Apples per game (n=32)</text><rect x="490.0" y="100" width="199.7" height="23" rx="3" fill="#34d399"/><text x="698.6" y="117" text-anchor="start" fill="#f8fafc">+0.605</text><text x="18" y="179" fill="#cbd5e1">Final body length (n=32)</text><rect x="490.0" y="162" width="68.3" height="23" rx="3" fill="#34d399"/><text x="567.3" y="179" text-anchor="start" fill="#f8fafc">+0.207</text><text x="18" y="241" fill="#cbd5e1">Kills per game (n=32)</text><rect x="490.0" y="224" width="79.2" height="23" rx="3" fill="#34d399"/><text x="578.2" y="241" text-anchor="start" fill="#f8fafc">+0.240</text><text x="18" y="303" fill="#cbd5e1">Retained growth / expected no-r (n=32)</text><rect x="490.0" y="286" width="76.9" height="23" rx="3" fill="#34d399"/><text x="575.9" y="303" text-anchor="start" fill="#f8fafc">+0.233</text></g></svg>