<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445"><rect width="1000" height="445" fill="#111a2b" rx="15"/><text x="30" y="38" fill="#f8fafc" font-family="sans-serif" font-size="22">Recovery of local exits vs later death</text><g fill="#cbd5e1" font-family="sans-serif" font-size="12"><line x1="110" y1="369" x2="920" y2="369" stroke="#64748b"/><text x="110" y="78">Risk of death in turns 11–30 among first-ten survivors</text><text x="110" y="98">Exit gain: at least one extra free neighbor at turn +3</text><text x="290" y="410" text-anchor="middle">League (observational, not causal)</text><rect x="226" y="365.0" width="60" height="4.0" fill="#34d399" rx="4"/><text x="256" y="351.0" text-anchor="middle">1.6%</text><text x="256" y="387" text-anchor="middle">Gain</text><rect x="298" y="361.0" width="60" height="8.0" fill="#60a5fa" rx="4"/><text x="328" y="347.0" text-anchor="middle">3.1%</text><text x="328" y="387" text-anchor="middle">No gain</text><text x="710" y="410" text-anchor="middle">Trial (observational, not causal)</text><rect x="646" y="365.0" width="60" height="4.0" fill="#34d399" rx="4"/><text x="676" y="351.0" text-anchor="middle">1.5%</text><text x="676" y="387" text-anchor="middle">Gain</text><rect x="718" y="366.4" width="60" height="2.6" fill="#60a5fa" rx="4"/><text x="748" y="352.4" text-anchor="middle">1.0%</text><text x="748" y="387" text-anchor="middle">No gain</text></g></svg>