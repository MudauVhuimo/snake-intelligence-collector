name: Publish validated route-space study once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_routes_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out existing archived league and trial replays
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require every offline regression test
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Recompute new route analysis and canonical dashboard
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,190p' data/reports/route_space.md
          sed -n '1,60p' data/reports/algorithm_rulebook.md
      - name: Publish ONLY derived reports, charts and aggregate CSVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if git diff --cached --quiet; then
            echo 'No derived outputs changed'
            exit 0
          fi
          git commit -m 'data: publish future-route-space modeling with whole-match uncertainty'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
