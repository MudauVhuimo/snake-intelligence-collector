name: Publish head-pressure research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_threat_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the archived public replay data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run all 56+ offline regression checks
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Rebuild canonical league and trial research
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,105p' data/reports/threat_windows.md
      - name: Publish only verified derived research, not raw replays or database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if git diff --cached --quiet; then
            echo 'Reports already current'
            exit 0
          fi
          git commit -m 'data: publish mode-separated head-pressure and escape-space study'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
