name: Build Snake26 research dashboard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout data and analysis code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run offline research tests
        run: python -m unittest -v test_research_dashboard
      - name: Generate five data-science figures
        run: python -m research.dashboard --data-dir data --max-files 250
      - name: Publish figures and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/data_science.md data/reports/charts/
          if git diff --cached --quiet; then
            echo 'No new report changes'
            exit 0
          fi
          git commit -m 'data: publish observational Snake26 research figures'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
