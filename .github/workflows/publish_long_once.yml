name: Publish 30-turn survival and Palmer casebook once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_long_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out existing Snake26 replay archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require all regression checks
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Rebuild verified research from local archival data
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,115p' data/reports/long_horizon_survival.md
          sed -n '1,70p' data/reports/palmer_casebook.md
      - name: Commit only derived reports and charts, never raw replays
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if git diff --cached --quiet; then
            echo 'No report changes to publish'
            exit 0
          fi
          git commit -m 'data: publish 30-turn danger survival and real Palmer casebook'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
