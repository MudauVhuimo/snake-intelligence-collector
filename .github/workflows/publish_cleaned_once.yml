name: Publish cleaned Snake26 research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_cleaned_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source and existing public replay archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full regression suite
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Rebuild controlled and league reports from local SQLite
        run: |
          python trial_leaderboard.py
          python -m research.league_comparison --data-dir data
          python -m research.league_sweet_spot --data-dir data
          python strategy_lab.py --stride 25
          python -m research.dashboard --data-dir data --max-files 250
          python -m research.food_races --data-dir data --max-files 250
          python -m research.underdog_study --data-dir data --max-files 250
          python -m research.path_geometry --data-dir data
          python -m research.integrated_dashboard --data-dir data
          cat data/derived/quality.json
      - name: Commit only reviewed research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish cleaned matched league/trial research dashboard'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'Research outputs already current'
          fi
