name: Publish field-wide Snake26 research once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_cohorts_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the archived replay and catalog database
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run all offline regression tests
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Build whole-competition cohort comparisons and rulebook
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,150p' data/reports/competitive_cohorts.md
          sed -n '1,150p' data/reports/algorithm_rulebook.md
      - name: Publish only derived reports and CSV summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if git diff --cached --quiet; then
            echo 'All published reports are current'
            exit 0
          fi
          git commit -m 'data: publish full-field cohort comparisons and algorithm rulebook'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
# second-pass: publish within-match matched observations and replay-cluster uncertainty
