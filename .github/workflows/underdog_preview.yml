name: Preview underdog apple path investigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/underdog_preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout archived public replays
        uses: actions/checkout@v4
      - name: Test turn-by-turn underdog analysis
        run: python -m unittest -v test_underdog_study
      - name: Analyze real archived apple races
        run: |
          python -m research.underdog_study --data-dir data --max-files 250
          sed -n '1,125p' data/reports/underdog_study.md
      - name: Archive cases, figures, and report
        uses: actions/upload-artifact@v4
        with:
          name: snake26-underdog-investigation
          path: |
            data/reports/underdog_study.md
            data/reports/underdog_episodes.csv
            data/reports/underdog_examples.json
            data/reports/charts/underdog_*.svg
            data/reports/charts/underdog_case_*.svg
