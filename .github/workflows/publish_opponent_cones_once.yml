name: Publish audited opponent-head study once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_opponent_cones_once.yml'

permissions:
  contents: write

concurrency:
  group: snake-intelligence-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout existing replay archive and research
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run offline mechanics and data-quality tests
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Build joined league and trial opponent-cone reports
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,190p' data/reports/opponent_cones.md
          cat data/derived/route_cone_quality.json
      - name: Commit derived results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports/ data/derived/
          if git diff --cached --quiet; then
            echo 'Already published'
            exit 0
          fi
          git commit -m 'data: publish opponent reachability, head-on audit and held-out comparison'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
