name: Validate Snake26 research (read-only)

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'test*.py'
      - 'strategy_lab.py'
      - 'trial_leaderboard.py'
      - 'docs/**'
      - '.github/workflows/research_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - 'test*.py'
      - 'docs/**'
      - '.github/workflows/research_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snake-research-readonly
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source and archived database
        uses: actions/checkout@v4
      - name: Run every offline regression test
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Rebuild canonical joined datasets without network access
        run: |
          python -m research.integrated_dashboard --data-dir data
          sed -n '1,85p' data/reports/joint_analysis.md
          cat data/derived/quality.json
          sed -n '1,75p' data/reports/historical_peer_comparison.md
          sed -n '1,58p' data/reports/seasonal_disagreement.md
          sed -n '1,115p' data/reports/threat_windows.md
          sed -n '1,120p' data/reports/escape_autopsies.md
          sed -n '1,155p' data/reports/long_horizon_survival.md
          sed -n '1,80p' data/reports/palmer_casebook.md
          sed -n '1,110p' data/reports/competitive_cohorts.md
          sed -n '1,160p' data/reports/route_space.md
          sed -n '1,170p' data/reports/opponent_cones.md
          sed -n '1,135p' data/reports/algorithm_rulebook.md
      - name: Study league apple contests (read-only replay analysis)
        run: |
          python -m research.league_food_contests --data-dir data
          python -m research.league_food_outcomes --data-dir data
          sed -n '1,120p' data/reports/league_food_prediction.md
          sed -n '1,120p' data/reports/league_food_contests.md
      - name: Save validated report and charts (never commits data)
        uses: actions/upload-artifact@v4
        with:
          name: snake26-joined-research
          path: |
            data/derived/*.csv
            data/derived/quality.json
            data/derived/seasonal_rank_gaps.csv
            data/reports/seasonal_disagreement.md
            data/reports/charts/historical_rank_alignment.svg
            data/reports/charts/league_trial_outliers.svg
            data/reports/historical_peer_comparison.md
            data/reports/charts/historical_peer_vs_trial.svg
            data/derived/historical_peer_trial_correlations.csv
            data/derived/historical_peer_trial_students.csv
            data/reports/README.md
            data/reports/joint_analysis.md
            data/reports/behavior_by_mode.md
            data/reports/threat_windows.md
            data/reports/escape_autopsies.md
            data/reports/long_horizon_survival.md
            data/reports/palmer_casebook.md
            data/reports/competitive_cohorts.md
            data/reports/route_space.md
            data/reports/opponent_cones.md
            data/reports/charts/opponent_contests.svg
            data/derived/opponent_cone_cohorts.csv
            data/derived/opponent_cone_paired_students.csv
            data/derived/route_cone_quality.json
            data/reports/charts/route_choice_cohorts.svg
            data/derived/route_choice_windows.csv
            data/derived/route_choice_cohorts.csv
            data/reports/algorithm_rulebook.md
            data/reports/league_food_contests.md
            data/reports/league_food_prediction.md
            data/derived/league_food_contests.csv
            data/reports/charts/cohort_danger_outcomes.svg
            data/derived/competitive_cohort_danger.csv
            data/derived/competitive_matched_decisions.csv
            data/derived/palmer_league_casebook.csv
            data/reports/charts/danger_survival_30.svg
            data/reports/charts/escape_recovery_late_death.svg
            data/derived/long_horizon_danger_windows.csv
            data/reports/charts/escape_case_control.svg
            data/reports/charts/escape_example_trace.svg
            data/derived/escape_matched_pairs.csv
            data/reports/charts/head_pressure_vs_death.svg
            data/derived/threat_window_*.csv
            data/reports/charts/observed_*_by_mode.svg
            data/reports/charts/joint_*.svg
